{% extends "layout.html" %}

{% block content %}

    <h1>Stocks Dashboard</h1>

    <form action="/stocks/dashboard" method="GET" class="mt-3" style="max-width: 400px;">

        <label for="symbol" class="form-label">Stock symbol:</label>
        <input type="text" name="symbol" id="symbol" class="form-control mb-3" placeholder="NFLX" value="NFLX" required>

        <button type="submit" class="btn btn-primary">Fetch Data</button>

    </form>

{% endblock %}
