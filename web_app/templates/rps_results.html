{% extends "layout.html" %}

{% block content %}

    <h1>Results</h1>

    <div class="card" style="max-width: 400px;">
        <div class="card-body">
            <p class="card-text">You chose: <strong>{{ user_choice }}</strong></p>
            <p class="card-text">The computer chose: <strong>{{ computer_choice }}</strong></p>
            <h2 class="card-title">{{ outcome }}</h2>
        </div>
    </div>

    <a href="/rps/form" class="btn btn-primary mt-3">Play again</a>

{% endblock %}
